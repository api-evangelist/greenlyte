name: Greenlyte
description: >-
  Greenlyte Carbon Technologies is an Essen, Germany based climate-tech company building
  its LiquidSolar platform, which liquefies air, sun, and water into 99% pure carbon and
  hydrogen feedstocks to produce synthetic e-fuels (sustainable aviation fuel, synthetic
  methanol, and synthetic natural gas) for hard-to-decarbonize industries. Founded as a
  direct air capture and power-to-liquid venture, Greenlyte has raised more than 55M EUR
  from Carbon Removal Partners, Earlybird, Partech, AENU, and Green Generation Fund. It was
  surfaced through VC portfolio mining and added to the API Evangelist network. As of this
  enrichment pass Greenlyte publishes no public developer, API, or documentation surface;
  this profile captures its verifiable web identity and domain-security posture.
